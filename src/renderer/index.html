<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:3737; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Update banner -->
<div id="update-banner" style="display:none;position:fixed;bottom:28px;right:16px;z-index:9999;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:12px;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:360px">
  <i class="ti ti-cloud-download" style="font-size:16px;flex-shrink:0"></i>
  <div style="flex:1">
    <div id="update-banner-title" style="font-weight:600;margin-bottom:2px">Nueva versión disponible</div>
    <div id="update-banner-sub" style="opacity:.85;font-size:11px"></div>
  </div>
  <button id="update-banner-btn" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;flex-shrink:0">Actualizar</button>
  <button onclick="document.getElementById('update-banner').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0">×</button>
</div>

<!-- App shell -->
<div id="app">
  <nav class="sidebar">
    <div class="sidebar-logo"><i class="ti ti-robot"></i></div>
    <div class="nav-btn active" data-view="projects" onclick="switchView('projects')"><i class="ti ti-layout-grid"></i><span class="tip">Proyectos</span></div>
    <div class="nav-btn" data-view="agents" onclick="switchView('agents')"><i class="ti ti-cpu"></i><span class="tip">Agentes</span></div>
    <div class="nav-btn" data-view="chat" onclick="switchView('chat')"><i class="ti ti-message-chatbot"></i><span class="tip">Chat IA</span></div>
    <div class="sidebar-spacer"></div>
    <div class="nav-set" data-view="settings" onclick="switchView('settings')"><i class="ti ti-settings"></i><span class="tip">Ajustes</span></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="tb-title">Proyectos</span>
      <div class="topbar-sep"></div>
      <span class="topbar-sub" id="tb-sub"></span>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions" id="tb-actions"></div>
    </div>
    <div class="view active" id="view-projects"></div>
    <div class="view" id="view-agents"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-chat"></div>
    <div class="statusbar">
      <div class="status-item"><div class="sdot green" id="srv-dot"></div><span id="srv-lbl">Iniciando…</span></div>
      <div class="status-item"><i class="ti ti-folder" style="font-size:11px"></i><span id="dir-lbl" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
      <div class="status-item" style="margin-left:auto"><span id="ver-lbl" style="color:var(--text3)">v1.0.0</span></div>
    </div>
  </div>
</div>

<!-- Wizard -->
<div class="wiz-overlay" id="wizard" style="display:none">
  <div class="wiz-card">
    <div class="wiz-head">
      <div class="wiz-dots"><div class="wiz-dot cur" id="wd0"></div><div class="wiz-dot" id="wd1"></div><div class="wiz-dot" id="wd2"></div></div>
      <div class="wiz-title" id="wiz-title"></div>
      <div class="wiz-sub" id="wiz-sub"></div>
    </div>
    <div class="wiz-body" id="wiz-body"></div>
    <div class="wiz-foot">
      <span class="wiz-skip" id="wiz-skip" onclick="wizSkip()"></span>
      <button class="btn primary" id="wiz-next" onclick="wizNext()">Continuar <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer" style="display:none" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawer-inner"></div>
</div>

<!-- Toasts -->
<div class="toast-wrap" id="toasts"></div>

<!-- Scripts (order matters: deps before consumers) -->
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/category-helpers.js"></script>
<script src="js/view-manager.js"></script>
<script src="js/projects-view.js"></script>
<script src="js/agents-view.js"></script>
<script src="js/settings-view.js"></script>
<script src="js/chat-view.js"></script>
<script src="js/wizard.js"></script>
<script src="js/update.js"></script>
<script src="js/init.js"></script>

</body>
</html>
