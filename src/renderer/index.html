<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:3737; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Dev Manager</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0d0d0f;--bg1:#141416;--bg2:#1a1a1d;--bg3:#222226;--bg4:#2a2a2f;--bg5:#323238;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.10);--border3:rgba(255,255,255,0.16);
  --text0:#f2f2f3;--text1:#a8a8b3;--text2:#62626e;--text3:#3e3e48;
  --accent:#7c6af7;--green:#34d399;--amber:#fbbf24;--blue:#60a5fa;--coral:#fb7185;
  --accent-dim:rgba(124,106,247,0.12);--green-dim:rgba(52,211,153,0.10);
  --amber-dim:rgba(251,191,36,0.10);--blue-dim:rgba(96,165,250,0.10);--coral-dim:rgba(251,113,133,0.10);
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--sans);font-size:13px;line-height:1.6;overflow:hidden;user-select:none}
/* ── Shell ── */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:48px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;flex-shrink:0;z-index:10}
.sidebar-logo{width:32px;height:32px;background:var(--accent-dim);border:1px solid rgba(124,106,247,0.25);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;flex-shrink:0}
.sidebar-logo i{font-size:17px;color:var(--accent)}
.nav-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:4px;color:var(--text2);border:1px solid transparent;transition:all .15s;position:relative}
.nav-btn:hover{background:var(--bg3);color:var(--text0)}
.nav-btn.active{background:var(--accent-dim);border-color:rgba(124,106,247,0.25);color:var(--accent)}
.nav-btn i{font-size:18px}
.nav-btn .tip,.nav-set .tip{position:absolute;left:calc(100% + 10px);background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--text0);white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-4px);transition:all .15s;z-index:100}
.nav-btn:hover .tip,.nav-set:hover .tip{opacity:1;transform:translateX(0)}
.sidebar-spacer{flex:1}
.nav-set{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);border:1px solid transparent;transition:all .15s;position:relative}
.nav-set:hover{background:var(--bg3);color:var(--text0)}
.nav-set.active{background:var(--accent-dim);border-color:rgba(124,106,247,0.25);color:var(--accent)}
.nav-set i{font-size:18px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg0)}
/* ── Topbar ── */
.topbar{height:44px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.topbar-title{font-size:13px;font-weight:600;color:var(--text0)}
.topbar-sep{width:1px;height:14px;background:var(--border2)}
.topbar-sub{font-size:11px;color:var(--text2);font-family:var(--mono)}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;gap:6px}
/* ── Views ── */
.view{flex:1;overflow:hidden;display:none}
.view.active{display:flex}
/* ── Statusbar ── */
.statusbar{height:22px;background:var(--bg1);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:14px;flex-shrink:0}
.status-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);font-family:var(--mono)}
.sdot{width:6px;height:6px;border-radius:50%}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;font-size:12px;font-weight:500;border-radius:8px;cursor:pointer;border:1px solid var(--border2);background:var(--bg4);color:var(--text0);font-family:var(--sans);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg5);border-color:var(--border3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--bg3);color:var(--text0)}
.btn.danger{color:var(--coral)}
.btn.danger:hover{background:var(--coral-dim);border-color:rgba(251,113,133,0.3)}
.btn.sm{padding:4px 10px;font-size:11px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* ── Forms ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--text0);font-family:var(--sans);transition:border-color .15s;outline:none}
.field textarea{font-family:var(--mono);font-size:11px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--text3)}
.field select option{background:var(--bg2)}
.field .hint{font-size:11px;color:var(--text2);margin-top:4px}
/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;border:1px solid}
.badge.green{background:var(--green-dim);border-color:rgba(52,211,153,0.25);color:var(--green)}
.badge.amber{background:var(--amber-dim);border-color:rgba(251,191,36,0.25);color:var(--amber)}
.badge.blue{background:var(--blue-dim);border-color:rgba(96,165,250,0.25);color:var(--blue)}
.badge.accent{background:var(--accent-dim);border-color:rgba(124,106,247,0.25);color:var(--accent)}
.badge.gray{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.badge.coral{background:var(--coral-dim);border-color:rgba(251,113,133,0.25);color:var(--coral)}
/* ── Spinner ── */
.spin{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Toast ── */
.toast-wrap{position:fixed;bottom:28px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000}
.toast{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;font-size:12px;color:var(--text0);animation:slideIn .2s ease;max-width:340px}
.toast.ok{border-color:rgba(52,211,153,0.3)}.toast.ok i{color:var(--green)}
.toast.err{border-color:rgba(251,113,133,0.3)}.toast.err i{color:var(--coral)}
.toast.info{border-color:rgba(96,165,250,0.3)}.toast.info i{color:var(--blue)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border:1px solid var(--border3);border-radius:14px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
.modal.wide{width:640px}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0}
.modal-title{font-size:15px;font-weight:700;color:var(--text0)}
.modal-sub{font-size:12px;color:var(--text1);margin-top:3px}
.modal-body{padding:20px 24px;flex:1}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0}

/* ────────────────────────────────────────
   VISTA PROYECTOS
──────────────────────────────────────── */
.projects-view{flex:1;overflow-y:auto;padding:24px}
.projects-view::-webkit-scrollbar{width:5px}
.projects-view::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.cat-section{margin-bottom:32px}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:12px;font-weight:600;color:var(--text0);text-transform:uppercase;letter-spacing:.07em}
.cat-count{font-size:11px;color:var(--text2);font-family:var(--mono)}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.proj-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.proj-card:hover{border-color:var(--border2);background:var(--bg3)}
.proj-card.selected{border-color:var(--accent);background:var(--accent-dim)}
.proj-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.proj-card-name{font-size:13px;font-weight:600;color:var(--text0)}
.proj-pending{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;background:var(--amber-dim);border:1px solid rgba(251,191,36,0.3);color:var(--amber)}
.proj-card-meta{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.proj-card-actions{display:flex;gap:5px;flex-wrap:wrap}
.proj-add-card{background:transparent;border:1px dashed var(--border2);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text2);transition:all .15s;min-height:100px;font-size:12px}
.proj-add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.proj-add-card i{font-size:22px}

/* ────────────────────────────────────────
   VISTA AGENTES
──────────────────────────────────────── */
.agents-view{flex:1;overflow:hidden;display:flex}
/* tree sidebar */
.agents-tree{width:220px;background:var(--bg1);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:8px 0}
.agents-tree::-webkit-scrollbar{width:4px}
.agents-tree::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.tree-section{margin-bottom:2px}
.tree-node{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;border-radius:6px;margin:1px 6px;color:var(--text1);font-size:12px;transition:background .1s,color .1s;user-select:none;position:relative}
.tree-node:hover{background:var(--bg3);color:var(--text0)}
.tree-node.active{background:var(--accent-dim);color:var(--accent)}
.tree-node.active .tree-chevron{color:var(--accent)}
.tree-indent{width:14px;flex-shrink:0}
.tree-chevron{font-size:13px;color:var(--text3);transition:transform .15s;flex-shrink:0}
.tree-chevron.open{transform:rotate(90deg)}
.tree-icon{font-size:14px;flex-shrink:0}
.tree-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-badge{font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:20px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,0.25);flex-shrink:0}
/* agents center panel */
.agents-center{flex:1;overflow:hidden;display:flex;flex-direction:column}
.agents-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg1)}
.agents-panel-title{font-size:12px;font-weight:600;color:var(--text0);flex:1}
.agents-panel-sub{font-size:11px;color:var(--text2);font-family:var(--mono)}
.agents-content{flex:1;overflow-y:auto;padding:16px}
.agents-content::-webkit-scrollbar{width:5px}
.agents-content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.agent-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.agent-card:hover{border-color:var(--border2);background:var(--bg3)}
.agent-card.selected{border-color:var(--accent);background:var(--accent-dim)}
.agent-card.suggested{border-style:dashed;opacity:.7}
.agent-card.suggested:hover{opacity:1;border-color:var(--green);background:var(--green-dim)}
.agent-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.agent-name{font-size:12px;font-weight:600;color:var(--text0);font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-desc{font-size:11px;color:var(--text1);line-height:1.5;margin-bottom:8px;min-height:32px}
.agent-footer{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tool-pill{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--mono)}
.model-pill{font-size:10px;padding:2px 6px;border-radius:4px;font-family:var(--mono);margin-left:auto}
.model-haiku{background:var(--green-dim);color:var(--green)}
.model-sonnet{background:var(--amber-dim);color:var(--amber)}
.model-opus{background:var(--accent-dim);color:var(--accent)}
/* agent editor panel */
.agent-editor{width:300px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.editor-head{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.editor-title{font-size:12px;font-weight:600;color:var(--text0);font-family:var(--mono);flex:1}
.editor-sub{font-size:10px;color:var(--text2);margin-top:2px}
.editor-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.editor-body::-webkit-scrollbar{width:4px}
.editor-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.editor-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px}
/* AI generate area */
.ai-gen-area{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.ai-gen-row{display:flex;gap:6px;margin-bottom:8px}
.ai-gen-input{flex:1;background:var(--bg1);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--text0);font-family:var(--sans);outline:none}
.ai-gen-input:focus{border-color:var(--accent)}
.lang-toggle{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:5px 9px;font-size:10px;font-family:var(--mono);cursor:pointer;background:transparent;color:var(--text2);border:none;transition:all .12s}
.lang-btn.active{background:var(--accent);color:#fff}
/* tools checkboxes */
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool-check{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--text1);font-family:var(--mono)}
.tool-check:hover{background:var(--bg3);color:var(--text0)}
.tool-check input{accent-color:var(--accent);cursor:pointer}
/* sync status in editor */
.sync-status-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.sync-status-item:last-child{border-bottom:none}

/* ────────────────────────────────────────
   AJUSTES
──────────────────────────────────────── */
.settings-view{flex:1;overflow-y:auto;padding:32px}
.settings-view::-webkit-scrollbar{width:5px}
.settings-view::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.settings-section{max-width:640px;margin-bottom:36px}
.settings-head{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.settings-head::after{content:'';flex:1;height:1px;background:var(--border)}
.provider-option{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s;margin-bottom:8px}
.provider-option.selected{border-color:var(--accent);background:var(--accent-dim)}
.provider-option-head{display:flex;align-items:center;gap:10px}
.provider-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border3);flex-shrink:0;position:relative;transition:all .15s}
.provider-radio.on{border-color:var(--accent);background:var(--accent)}
.provider-radio.on::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#fff}
.cat-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.cat-item-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-item-name{font-size:13px;font-weight:600;color:var(--text0);flex:1}
.tech-pills{display:flex;flex-wrap:wrap;gap:5px}
.tech-pill{display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text1);font-family:var(--mono)}
.tech-pill .del{color:var(--text3);cursor:pointer;font-size:12px}
.tech-pill .del:hover{color:var(--coral)}

/* ────────────────────────────────────────
   PROJECT DETAIL DRAWER
──────────────────────────────────────── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;justify-content:flex-end}
.drawer{width:560px;background:var(--bg1);border-left:1px solid var(--border2);display:flex;flex-direction:column;height:100%;overflow:hidden;animation:slideRight .2s ease}
@keyframes slideRight{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-title{font-size:15px;font-weight:700;color:var(--text0);margin-bottom:4px}
.drawer-meta{display:flex;gap:8px;flex-wrap:wrap}
.drawer-tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-tab{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .12s;margin-bottom:-1px}
.drawer-tab:hover{color:var(--text0)}
.drawer-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-body::-webkit-scrollbar{width:5px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.claude-md-editor{width:100%;min-height:400px;background:var(--bg0);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--text0);resize:vertical;outline:none;transition:border-color .15s}
.claude-md-editor:focus{border-color:var(--accent)}
.sync-agent-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.sync-agent-row:last-child{border-bottom:none}
.sync-agent-name{font-family:var(--mono);font-size:11px;color:var(--text0);flex:1}
.sync-agent-level{font-size:10px;color:var(--text2);font-family:var(--mono)}

/* ────────────────────────────────────────
   WIZARD
──────────────────────────────────────── */
.wiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.wiz-card{background:var(--bg2);border:1px solid var(--border3);border-radius:16px;width:500px;overflow:hidden}
.wiz-head{padding:24px 28px 20px;border-bottom:1px solid var(--border)}
.wiz-dots{display:flex;gap:6px;margin-bottom:16px}
.wiz-dot{height:3px;flex:1;border-radius:2px;background:var(--bg5);transition:background .3s}
.wiz-dot.done{background:var(--accent)}
.wiz-dot.cur{background:var(--accent);opacity:.5}
.wiz-title{font-size:18px;font-weight:700;color:var(--text0);margin-bottom:6px}
.wiz-sub{font-size:12px;color:var(--text1);line-height:1.6}
.wiz-body{padding:22px 28px}
.wiz-foot{padding:16px 28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.wiz-skip{font-size:11px;color:var(--text2);cursor:pointer}
.wiz-skip:hover{color:var(--text1)}
.ai-opt{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:8px}
.ai-opt:hover{border-color:var(--border3);background:var(--bg4)}
.ai-opt.on{border-color:var(--accent);background:var(--accent-dim)}
.ai-opt-head{display:flex;align-items:center;gap:10px}
.ai-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border3);flex-shrink:0;position:relative;transition:all .15s}
.ai-radio.on{border-color:var(--accent);background:var(--accent)}
.ai-radio.on::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#fff}
.setup-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text1);margin-bottom:8px}
</style>
</head>

<div id="update-banner" style="display:none;position:fixed;bottom:28px;right:16px;z-index:9999;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:12px;display:none;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:360px">

  <div class="wiz-card">

<div class="toast-wrap" id="toasts"></div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const API = 'http://localhost:3737/api';
const S = {
  view: 'projects',
  config: null,
  projects: [],
  // agents view
  treeExpanded: new Set(['global','cats','projs']),
  selectedNode: { level:'global', categoryId:null, techId:null, projectId:null },
  agents: [],
  suggestions: [],
  suggestionsLoading: false,
  selectedAgent: null,
  editorAgent: null,
  editorDirty: false,
  editorLang: 'en',
  // wizard
  wizStep: 0,
  cliFound: false,
  cliPath: null,
  aiChoice: 'cli',
};

// ══════════════════════════════════════════
// API
// ══════════════════════════════════════════
async function req(method, ep, body) {
  const r = await fetch(API + ep, {
    method,
    headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg, type='ok') {
  const icons = {ok:'ti-check', err:'ti-alert-circle', info:'ti-info-circle'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="ti ${icons[type]||'ti-info-circle'}"></i><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ══════════════════════════════════════════
// VIEW SWITCHING
// ══════════════════════════════════════════
const VIEW_META = {
  projects: {title:'Proyectos', sub:''},
  agents:   {title:'Agentes',   sub:''},
  settings: {title:'Ajustes',   sub:'Configuración'},
};

function switchView(name) {
  S.view = name;
  document.querySelectorAll('.nav-btn,.nav-set').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id===`view-${name}`));
  document.getElementById('tb-title').textContent = VIEW_META[name]?.title || name;
  if (name==='projects')  renderProjectsView();
  if (name==='agents')    renderAgentsView();
  if (name==='settings')  renderSettingsView();
}

// ══════════════════════════════════════════
// CATEGORY HELPERS
// ══════════════════════════════════════════
const CAT_COLORS = {games:'#34d399', web:'#60a5fa', mobile:'#fbbf24', docs:'#fb7185'};
function catColor(id) { return CAT_COLORS[id] || (S.config?.categories?.find(c=>c.id===id)?.color) || '#888'; }
function catName(id)  { return S.config?.categories?.find(c=>c.id===id)?.name || id; }
function techName(catId, techId) {
  const cat = S.config?.categories?.find(c=>c.id===catId);
  return cat?.technologies?.find(t=>t.id===techId)?.name || techId;
}

// ══════════════════════════════════════════
// ── VISTA PROYECTOS ──
// ══════════════════════════════════════════
async function loadProjects() {
  S.projects = await req('GET','/projects');
}

function renderProjectsView() {
  const cats = S.config?.categories || [];
  const tb = document.getElementById('tb-actions');
  tb.innerHTML = `
    <button class="btn primary sm" onclick="openCreateProject()"><i class="ti ti-plus"></i> Nuevo proyecto</button>
    <button class="btn sm" onclick="openImportProject()"><i class="ti ti-folder-open"></i> Importar</button>
    <button class="btn sm" onclick="syncAllProjects()" title="Sync todos los proyectos"><i class="ti ti-refresh"></i> Sync todos</button>`;

  document.getElementById('tb-sub').textContent = `${S.projects.length} proyecto${S.projects.length!==1?'s':''}`;

  let html = '<div class="projects-view">';
  const empty = S.projects.length === 0;

  if (empty) {
    html += `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:var(--text2)">
      <i class="ti ti-folder-open" style="font-size:48px;opacity:.2"></i>
      <div style="font-size:14px;color:var(--text1)">Sin proyectos todavía</div>
      <div style="font-size:12px;text-align:center;max-width:300px">Crea tu primer proyecto o importa uno existente con los botones de arriba.</div>
    </div>`;
  } else {
    cats.forEach(cat => {
      const projs = S.projects.filter(p=>p.categoryId===cat.id);
      if (!projs.length) return;
      html += `<div class="cat-section">
        <div class="cat-header">
          <div class="cat-dot" style="background:${cat.color}"></div>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">${projs.length}</span>
        </div>
        <div class="projects-grid">
          ${projs.map(p=>projectCard(p)).join('')}
        </div>
      </div>`;
    });
    // uncategorised
    const knownCats = new Set(cats.map(c=>c.id));
    const uncats = S.projects.filter(p=>!knownCats.has(p.categoryId));
    if (uncats.length) {
      html += `<div class="cat-section">
        <div class="cat-header"><div class="cat-dot" style="background:#888"></div><span class="cat-name">Sin categoría</span></div>
        <div class="projects-grid">${uncats.map(p=>projectCard(p)).join('')}</div>
      </div>`;
    }
  }
  html += '</div>';
  document.getElementById('view-projects').innerHTML = html;
}

function projectCard(p) {
  const pending = p.pendingUpdates || 0;
  const exists  = p.pathExists !== false;
  const statusColors = {active:'green', paused:'amber', archived:'gray'};
  return `<div class="proj-card" onclick="openProjectDrawer('${p.id}')">
    <div class="proj-card-head">
      <div class="proj-card-name">${esc(p.name)}</div>
      ${pending>0 ? `<span class="proj-pending"><i class="ti ti-arrow-up"></i>${pending}</span>` : ''}
    </div>
    <div class="proj-card-meta">
      ${p.techId ? `<span class="badge blue">${esc(techName(p.categoryId,p.techId))}</span>` : `<span class="badge gray">${esc(catName(p.categoryId))}</span>`}
      <span class="badge ${statusColors[p.status]||'gray'}">${p.status||'active'}</span>
      ${!exists ? `<span class="badge coral"><i class="ti ti-alert-triangle"></i> ruta no encontrada</span>` : ''}
    </div>
    <div class="proj-card-actions" onclick="event.stopPropagation()">
      <button class="btn sm ghost" onclick="openVSCode('${p.id}')" title="Abrir en VS Code"><i class="ti ti-brand-vscode"></i></button>
      <button class="btn sm ghost" onclick="openFolder('${p.id}')" title="Abrir carpeta"><i class="ti ti-folder-open"></i></button>
      ${pending>0 ? `<button class="btn sm" onclick="syncProject('${p.id}')" style="color:var(--amber);border-color:rgba(251,191,36,0.3);background:var(--amber-dim)"><i class="ti ti-refresh"></i> Sync</button>` : ''}
    </div>
  </div>`;
}

async function syncProject(id) {
  try {
    const r = await req('POST',`/projects/${id}/sync`);
    toast(`Sync completado: ${r.updated} actualizado${r.updated!==1?'s':''}, ${r.added} nuevo${r.added!==1?'s':''}`);
    await loadProjects(); renderProjectsView();
  } catch(e) { toast(e.message,'err'); }
}

async function syncAllProjects() {
  try {
    const results = await req('POST','/sync-all');
    const total = results.reduce((a,r)=>a+(r.updated||0)+(r.added||0),0);
    toast(`Sync global: ${total} cambios aplicados en ${results.length} proyecto${results.length!==1?'s':''}`);
    await loadProjects(); renderProjectsView();
  } catch(e) { toast(e.message,'err'); }
}

// ── Create / Import modals ──
function openCreateProject() {
  const cats = S.config?.categories || [];
  showModal('Nuevo proyecto', '', `
    <div class="field"><label>Nombre del proyecto</label><input id="mp-name" placeholder="Mi RPG Unity"/></div>
    <div class="field"><label>Categoría</label>
      <select id="mp-cat" onchange="updateTechSelect()">${cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Tecnología</label><select id="mp-tech"></select></div>
    <div class="field"><label>Ruta donde crear la carpeta</label><input id="mp-path" placeholder="C:/Proyectos"/><div class="hint">Se creará una subcarpeta con el nombre del proyecto</div></div>
    <div class="field"><label>Descripción (opcional)</label><input id="mp-desc" placeholder="Breve descripción…"/></div>
  `, async ()=>{
    const name = document.getElementById('mp-name').value.trim();
    const cat  = document.getElementById('mp-cat').value;
    const tech = document.getElementById('mp-tech').value;
    const base = document.getElementById('mp-path').value.trim();
    const desc = document.getElementById('mp-desc').value.trim();
    if (!name||!cat||!base) { toast('Rellena nombre, categoría y ruta','err'); return false; }
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const projectPath = base.replace(/[/\\]$/,'') + '\\' + slug;
    try {
      await req('POST','/projects',{name,categoryId:cat,techId:tech||null,projectPath,description:desc});
      toast(`Proyecto "${name}" creado`);
      await loadProjects(); renderProjectsView();
    } catch(e){ toast(e.message,'err'); return false; }
  });
  updateTechSelect();
}

function openImportProject() {
  const cats = S.config?.categories || [];
  showModal('Importar proyecto existente','Selecciona una carpeta que ya existe en tu sistema.', `
    <div class="field"><label>Nombre</label><input id="mi-name" placeholder="Mi proyecto…"/></div>
    <div class="field"><label>Categoría</label>
      <select id="mi-cat" onchange="updateTechSelectImport()">${cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Tecnología</label><select id="mi-tech"></select></div>
    <div class="field"><label>Ruta de la carpeta existente</label><input id="mi-path" placeholder="C:/Dev/mi-proyecto"/></div>
  `, async ()=>{
    const name = document.getElementById('mi-name').value.trim();
    const cat  = document.getElementById('mi-cat').value;
    const tech = document.getElementById('mi-tech').value;
    const path = document.getElementById('mi-path').value.trim();
    if (!name||!cat||!path) { toast('Rellena todos los campos','err'); return false; }
    try {
      await req('POST','/projects/import',{name,categoryId:cat,techId:tech||null,projectPath:path});
      toast(`Proyecto "${name}" importado`);
      await loadProjects(); renderProjectsView();
    } catch(e){ toast(e.message,'err'); return false; }
  });
  updateTechSelectImport();
}

function updateTechSelect() {
  const cat  = document.getElementById('mp-cat')?.value;
  const sel  = document.getElementById('mp-tech');
  if (!sel||!cat) return;
  const techs = S.config?.categories?.find(c=>c.id===cat)?.technologies||[];
  sel.innerHTML = `<option value="">— Sin tecnología específica —</option>` + techs.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
}
function updateTechSelectImport() {
  const cat  = document.getElementById('mi-cat')?.value;
  const sel  = document.getElementById('mi-tech');
  if (!sel||!cat) return;
  const techs = S.config?.categories?.find(c=>c.id===cat)?.technologies||[];
  sel.innerHTML = `<option value="">— Sin tecnología específica —</option>` + techs.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
}

// ── Project Drawer ──
async function openProjectDrawer(id) {
  const p = S.projects.find(x=>x.id===id);
  if (!p) return;
  S.drawerProject = p;
  S.drawerTab = 'claude';
  await renderDrawer();
  document.getElementById('drawer').style.display = 'flex';
}
function closeDrawer() { document.getElementById('drawer').style.display='none'; S.drawerProject=null; }

async function renderDrawer() {
  const p = S.drawerProject;
  if (!p) return;
  const inner = document.getElementById('drawer-inner');

  let syncStatus = {};
  try { syncStatus = await req('GET',`/projects/${p.id}/sync-status`); } catch {}
  let claudeMd = '';
  try { const r = await req('GET',`/projects/${p.id}/context`); claudeMd = r.content||''; } catch {}

  const statusBadge = (s) => {
    if (s==='ok')       return `<span class="badge green"><i class="ti ti-check"></i>ok</span>`;
    if (s==='outdated') return `<span class="badge amber"><i class="ti ti-arrow-up"></i>actualizar</span>`;
    if (s==='new')      return `<span class="badge blue"><i class="ti ti-plus"></i>nuevo</span>`;
    if (s==='local')    return `<span class="badge gray"><i class="ti ti-user"></i>local</span>`;
    return `<span class="badge gray">${s}</span>`;
  };

  const syncRows = Object.entries(syncStatus).map(([name,entry])=>`
    <div class="sync-agent-row">
      <span class="sync-agent-name">${esc(name)}</span>
      <span class="sync-agent-level">${entry.agent?.level||''}</span>
      ${statusBadge(entry.status)}
    </div>`).join('');

  inner.innerHTML = `
    <div class="drawer-head">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="drawer-title">${esc(p.name)}</div>
        <button class="btn ghost sm" onclick="closeDrawer()"><i class="ti ti-x"></i></button>
      </div>
      <div class="drawer-meta">
        ${p.techId ? `<span class="badge blue">${esc(techName(p.categoryId,p.techId))}</span>` : ''}
        <span class="badge gray">${esc(catName(p.categoryId))}</span>
        <span class="badge ${p.status==='active'?'green':p.status==='paused'?'amber':'gray'}">${p.status||'active'}</span>
      </div>
    </div>
    <div class="drawer-tabs">
      <div class="drawer-tab ${S.drawerTab==='claude'?'active':''}" onclick="setDrawerTab('claude')">CLAUDE.md</div>
      <div class="drawer-tab ${S.drawerTab==='sync'?'active':''}" onclick="setDrawerTab('sync')">Agentes <span style="font-family:var(--mono);font-size:10px;color:var(--text2)">${Object.keys(syncStatus).length}</span></div>
    </div>
    <div class="drawer-body">
      ${S.drawerTab==='claude' ? `
        <div style="font-size:11px;color:var(--text2);margin-bottom:10px;font-family:var(--mono)">${esc(p.path)}\\CLAUDE.md</div>
        <textarea class="claude-md-editor" id="claude-md-ta">${esc(claudeMd)}</textarea>` : `
        <div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:12px;color:var(--text1)">${Object.values(syncStatus).filter(s=>s.status==='ok').length} al día, ${Object.values(syncStatus).filter(s=>s.status==='outdated'||s.status==='new').length} pendientes</span>
        </div>
        ${syncRows||'<div style="color:var(--text2);font-size:12px">Sin agentes registrados</div>'}
      `}
    </div>
    <div class="drawer-foot">
      ${S.drawerTab==='claude'
        ? `<button class="btn primary" onclick="saveClaudeMd('${p.id}')"><i class="ti ti-device-floppy"></i> Guardar</button>`
        : `<button class="btn" onclick="syncProject('${p.id}');closeDrawer()"><i class="ti ti-refresh"></i> Sync este proyecto</button>`
      }
      <button class="btn" onclick="openVSCode('${p.id}')"><i class="ti ti-brand-vscode"></i> VS Code</button>
      <button class="btn" onclick="openFolder('${p.id}')"><i class="ti ti-folder-open"></i> Carpeta</button>
      <div style="flex:1"></div>
      <button class="btn danger sm" onclick="confirmDeleteProject('${p.id}')"><i class="ti ti-trash"></i></button>
    </div>`;
}

async function setDrawerTab(tab) { S.drawerTab = tab; await renderDrawer(); }

async function saveClaudeMd(id) {
  const content = document.getElementById('claude-md-ta')?.value||'';
  try {
    await req('PUT',`/projects/${id}/context`,{content});
    toast('CLAUDE.md guardado');
  } catch(e) { toast(e.message,'err'); }
}

async function openVSCode(id) {
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  if (window.api) {
    const r = await window.api.openVSCode(p.path);
    if (!r.ok) toast(r.error,'err');
  } else {
    toast('Función disponible en la app de escritorio','info');
  }
}
async function openFolder(id) {
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  if (window.api) window.api.openPath(p.path);
  else toast('Función disponible en la app de escritorio','info');
}

async function confirmDeleteProject(id) {
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  showModal('Eliminar proyecto', `¿Eliminar "${esc(p.name)}" del manager?`, `
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer">
        <input type="checkbox" id="del-folder" style="accent-color:var(--coral)">
        También borrar la carpeta del disco (${esc(p.path)})
      </label>
      <div style="font-size:11px;color:var(--amber);padding:8px 10px;background:var(--amber-dim);border-radius:6px;border:1px solid rgba(251,191,36,.2)">

// ── VISTA AGENTES ──
// ══════════════════════════════════════════
async function loadAgentsForNode() {
  const n = S.selectedNode;
  if (n.level === 'project') {
    S.agents = n.projectId
      ? await req('GET', `/projects/${n.projectId}/agents`)
      : [];
  } else {
    const q = new URLSearchParams({level:n.level});
    if (n.categoryId) q.set('categoryId', n.categoryId);
    if (n.techId)     q.set('techId', n.techId);
    S.agents = await req('GET', `/agents?${q}`);
  }
  S.selectedAgent = null;
  S.editorAgent = null;
}

async function loadSuggestions(force=false) {
  const n = S.selectedNode;
  if (n.level === 'project') { S.suggestions=[]; return; }
  S.suggestionsLoading = true;
  renderAgentsCenter();
  try {
    const q = new URLSearchParams({level:n.level,force:force?'true':'false'});
    if (n.categoryId) q.set('categoryId', n.categoryId);
    if (n.techId)     q.set('techId', n.techId);
    S.suggestions = await req('GET', `/ai/suggestions?${q}`);
  } catch(e) {
    S.suggestions = [];
    if (force) toast('No se pudieron generar sugerencias: '+e.message,'err');
  }
  S.suggestionsLoading = false;
  renderAgentsCenter();
}

async function refreshSuggestions() {
  const n = S.selectedNode;
  S.suggestionsLoading = true;
  renderAgentsCenter();
  try {
    S.suggestions = await req('POST','/ai/suggestions/refresh',{
      level: n.level, categoryId: n.categoryId||null, techId: n.techId||null
    });
  } catch(e) { toast('Error: '+e.message,'err'); }
  S.suggestionsLoading = false;
  renderAgentsCenter();
}

async function selectTreeNode(level, categoryId, techId, projectId) {
  S.selectedNode = {level, categoryId:categoryId||null, techId:techId||null, projectId:projectId||null};
  S.suggestions = [];
  await loadAgentsForNode();
  renderAgentsTree();
  renderAgentsCenter();
  loadSuggestions();
}

function treeNodeId(level, catId, techId, projId) {
  return [level,catId||'',techId||'',projId||''].join('|');
}
function isNodeActive(level, catId, techId, projId) {
  const n = S.selectedNode;
  return n.level===level && n.categoryId===(catId||null) && n.techId===(techId||null) && n.projectId===(projId||null);
}

function renderAgentsView() {
  const el = document.getElementById('view-agents');
  el.className = 'view active';
  el.innerHTML = `
    <div class="agents-view">
      <div class="agents-tree" id="agents-tree"></div>
      <div class="agents-center" id="agents-center">
        <div class="agents-panel-head">
          <span class="agents-panel-title" id="agents-panel-title">Global</span>
          <div id="agents-panel-btns" style="display:flex;gap:6px"></div>
        </div>
        <div class="agents-content" id="agents-content"></div>
      </div>
      <div class="agent-editor" id="agent-editor" style="display:none"></div>
    </div>`;
  renderAgentsTree();
  renderAgentsCenter();
  document.getElementById('tb-sub').textContent = '';
  document.getElementById('tb-actions').innerHTML = '';
}

function renderAgentsTree() {
  const cats = S.config?.categories || [];
  const projs = S.projects || [];
  let h = '';

  // Global
  h += treeItem('global',null,null,null,'ti-world','var(--green)','Global',0);

  // Categories section
  const catsOpen = S.treeExpanded.has('cats');
  h += `<div class="tree-node" onclick="toggleTree('cats')" style="margin-top:8px">
    <i class="ti ti-chevron-right tree-chevron ${catsOpen?'open':''}"></i>
    <span style="font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.08em;text-transform:uppercase">Categorías</span>
  </div>`;
  if (catsOpen) {
    cats.forEach(cat => {
      const catOpen = S.treeExpanded.has('cat-'+cat.id);
      const catActive = isNodeActive('section',cat.id,null,null);
      h += `<div class="tree-node ${catActive?'active':''}" onclick="event.stopPropagation();toggleTree('cat-${cat.id}');selectTreeNode('section','${cat.id}',null,null)">
        <div class="tree-indent"></div>
        <i class="ti ti-chevron-right tree-chevron ${catOpen?'open':''}"></i>
        <i class="ti ${cat.icon||'ti-folder'} tree-icon" style="color:${cat.color}"></i>
        <span class="tree-label">${esc(cat.name)}</span>
      </div>`;
      if (catOpen) {
        cat.technologies?.forEach(tech => {
          h += treeItem('tech',cat.id,tech.id,null,'ti-code',cat.color,tech.name,2);
        });
        if (!cat.technologies?.length) {
          h += `<div class="tree-node" style="padding-left:40px;color:var(--text3);font-size:11px;pointer-events:none">Sin tecnologías</div>`;
        }
      }
    });
  }

  // Projects section
  const projsOpen = S.treeExpanded.has('projs');
  h += `<div class="tree-node" onclick="toggleTree('projs')" style="margin-top:8px">
    <i class="ti ti-chevron-right tree-chevron ${projsOpen?'open':''}"></i>
    <span style="font-size:10px;font-weight:600;color:var(--text2);letter-spacing:.08em;text-transform:uppercase">Proyectos</span>
  </div>`;
  if (projsOpen) {
    projs.forEach(p => {
      const active = isNodeActive('project',null,null,p.id);
      const pending = p.pendingUpdates || 0;
      h += `<div class="tree-node ${active?'active':''}" onclick="selectTreeNode('project',null,null,'${p.id}')">
        <div class="tree-indent"></div>
        <i class="ti ti-folder tree-icon" style="color:${catColor(p.categoryId)}"></i>
        <span class="tree-label">${esc(p.name)}</span>
        ${pending>0?`<span class="tree-badge">↑${pending}</span>`:''}
      </div>`;
    });
    if (!projs.length) {
      h += `<div class="tree-node" style="padding-left:28px;color:var(--text3);font-size:11px;pointer-events:none">Sin proyectos</div>`;
    }
  }

  document.getElementById('agents-tree').innerHTML = h;
}

function treeItem(level, catId, techId, projId, icon, color, label, indent) {
  const active = isNodeActive(level, catId, techId, projId);
  const indentHtml = Array(indent).fill('<div class="tree-indent"></div>').join('');
  return `<div class="tree-node ${active?'active':''}" onclick="selectTreeNode('${level}','${catId||''}','${techId||''}','${projId||''}')">
    ${indentHtml}
    <i class="ti ${icon} tree-icon" style="color:${color}"></i>
    <span class="tree-label">${esc(label)}</span>
  </div>`;
}

function toggleTree(key) {
  if (S.treeExpanded.has(key)) S.treeExpanded.delete(key);
  else S.treeExpanded.add(key);
  renderAgentsTree();
}

function renderAgentsCenter() {
  const n       = S.selectedNode;
  const agents  = S.agents || [];
  const suggs   = S.suggestions || [];
  const loading = S.suggestionsLoading;

  // Panel title
  let title = 'Global';
  if (n.level==='section') title = catName(n.categoryId);
  else if (n.level==='tech') title = `${catName(n.categoryId)} → ${techName(n.categoryId, n.techId)}`;
  else if (n.level==='project') { const p = S.projects.find(x=>x.id===n.projectId); title = p?.name||'Proyecto'; }
  document.getElementById('agents-panel-title').textContent = title;

  // Buttons
  const isProject = n.level==='project';
  document.getElementById('agents-panel-btns').innerHTML = `
    <button class="btn sm primary" onclick="openNewAgentEditor()"><i class="ti ti-plus"></i> Nuevo agente</button>
    ${!isProject ? `<button class="btn sm" onclick="refreshSuggestions()" ${loading?'disabled':''}>${loading?'<div class="spin"></div>':'<i class="ti ti-refresh"></i>'} Sugerir más</button>` : ''}`;

  // Agents grid
  const levelColors = {global:'var(--green)',section:'var(--blue)',tech:'var(--amber)',project:'var(--coral)'};
  const iconMap = name => {
    const n = name.toLowerCase();
    if (n.includes('unity'))  return 'ti-device-gamepad-2';
    if (n.includes('react')||n.includes('frontend')) return 'ti-brand-react';
    if (n.includes('test'))   return 'ti-player-play';
    if (n.includes('doc'))    return 'ti-file-description';
    if (n.includes('git'))    return 'ti-git-branch';
    if (n.includes('refactor')) return 'ti-arrows-exchange';
    if (n.includes('review')) return 'ti-eye';
    if (n.includes('db')||n.includes('database')||n.includes('backend')) return 'ti-database';
    if (n.includes('security')) return 'ti-shield';
    if (n.includes('mobile')) return 'ti-device-mobile';
    if (n.includes('shader')||n.includes('css')||n.includes('design')) return 'ti-palette';
    if (n.includes('perf'))   return 'ti-bolt';
    if (n.includes('diagram')) return 'ti-chart-dots';
    return 'ti-robot';
  };

  const agentCard = (a, suggested=false) => {
    const sel = !suggested && S.selectedAgent===a.name;
    const ic = iconMap(a.name);
    const modelCls = `model-${a.model||'sonnet'}`;
    return `<div class="agent-card ${sel?'selected':''} ${suggested?'suggested':''}"
      onclick="${suggested ? `useSuggestion(${JSON.stringify(a).replace(/"/g,'&quot;')})` : `selectAgent('${esc(a.name)}',${suggested})`}">
      <div class="agent-card-head">
        <div class="agent-icon" style="background:${suggested?'var(--bg3)':'var(--bg3)'}">
          <i class="ti ${ic}" style="color:${suggested?'var(--text2)':levelColors[n.level]}"></i>
        </div>
        <span class="agent-name">${esc(a.name)}</span>
        ${suggested?`<span class="badge gray" style="font-size:9px">sugerido</span>`:''}
      </div>
      <div class="agent-desc">${esc(a.description||'')}</div>
      <div class="agent-footer">
        ${(a.tools||[]).slice(0,3).map(t=>`<span class="tool-pill">${t}</span>`).join('')}
        ${(a.tools||[]).length>3?`<span style="font-size:10px;color:var(--text3)">+${(a.tools||[]).length-3}</span>`:''}
        <span class="tool-pill ${modelCls}" style="margin-left:auto">${a.model||'sonnet'}</span>
      </div>
    </div>`;
  };

  let content = `<div class="agents-grid">
    ${agents.map(a=>agentCard(a)).join('')}
    ${!isProject && !loading ? suggs.map(s=>agentCard(s,true)).join('') : ''}
    ${!isProject && loading ? `<div style="display:flex;align-items:center;gap:8px;color:var(--text2);font-size:12px;grid-column:1/-1"><div class="spin"></div>Generando sugerencias…</div>` : ''}
  </div>`;

  if (!agents.length && !loading && !suggs.length) {
    content = `<div style="display:flex;flex-direction:column;align-items:center;padding:60px;gap:10px;color:var(--text2)">
      <i class="ti ti-robot" style="font-size:40px;opacity:.2"></i>
      <div style="font-size:13px;color:var(--text1)">Sin agentes en este nivel</div>
      <div style="font-size:12px">Crea el primero o espera las sugerencias de IA</div>
    </div>`;
  }

  document.getElementById('agents-content').innerHTML = content;
}

function selectAgent(name, isSuggested) {
  if (isSuggested) return;
  S.selectedAgent = name;
  const agent = S.agents.find(a=>a.name===name);
  if (agent) openAgentEditor(agent, false);
  else renderAgentsCenter();
}

function useSuggestion(agent) {
  openAgentEditor(agent, true);
}

// ── Agent Editor ──
function openNewAgentEditor() {
  openAgentEditor({name:'',description:'',tools:['Read'],model:'sonnet',system:''}, true);
}

function openAgentEditor(agent, isNew) {
  S.editorAgent = {...agent};
  S.editorIsNew = isNew;
  S.editorDirty = false;
  renderAgentEditor();
  document.getElementById('agent-editor').style.display='flex';
}

const ALL_TOOLS = ['Bash','Read','Write','Grep','Edit','MultiEdit','WebFetch','WebSearch','TodoRead','TodoWrite'];

function renderAgentEditor() {
  const a = S.editorAgent;
  if (!a) return;
  const n = S.selectedNode;
  const isNew = S.editorIsNew;
  const tools = a.tools || [];

  const levelPath = (() => {
    if (n.level==='global') return '~/.claude-manager/agents/global/';
    if (n.level==='section') return `~/.claude-manager/agents/section-${n.categoryId}/`;
    if (n.level==='tech') return `~/.claude-manager/agents/tech-${n.categoryId}-${n.techId}/`;
    const p = S.projects.find(x=>x.id===n.projectId);
    return p ? `${p.path}\\.claude\\agents\\` : '';
  })();

  document.getElementById('agent-editor').innerHTML = `
    <div class="editor-head">
      <div style="flex:1">
        <div class="editor-title">${isNew ? 'Nuevo agente' : esc(a.name)}</div>
        <div class="editor-sub">${esc(levelPath)}</div>
      </div>
      <button class="btn ghost sm" onclick="closeAgentEditor()"><i class="ti ti-x"></i></button>
    </div>
    <div class="editor-body" id="editor-body">
      <div class="field"><label>Nombre</label>
        <input id="ea-name" value="${esc(a.name)}" placeholder="nombre-del-agente" style="font-family:var(--mono)"
          oninput="S.editorAgent.name=this.value;S.editorDirty=true"/>
      </div>
      <div class="field"><label>Descripción</label>
        <input id="ea-desc" value="${esc(a.description||'')}" placeholder="Breve descripción…"
          oninput="S.editorAgent.description=this.value;S.editorDirty=true"/>
      </div>
      <div class="field"><label>Modelo</label>
        <select id="ea-model" onchange="S.editorAgent.model=this.value;S.editorDirty=true">
          ${['haiku','sonnet','opus'].map(m=>`<option value="${m}" ${a.model===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Herramientas</label>
        <div class="tools-grid">
          ${ALL_TOOLS.map(t=>`<label class="tool-check">
            <input type="checkbox" ${tools.includes(t)?'checked':''} onchange="toggleTool('${t}',this.checked)"/>
            ${t}
          </label>`).join('')}
        </div>
      </div>

      <div class="field"><label>Generar con IA</label>
        <div class="ai-gen-area">
          <div class="ai-gen-row">
            <input class="ai-gen-input" id="ea-ai-desc" placeholder="Describe el agente en una frase…"/>
            <div class="lang-toggle">
              <button class="lang-btn ${S.editorLang==='es'?'active':''}" onclick="S.editorLang='es';renderAgentEditor()">ES</button>
              <button class="lang-btn ${S.editorLang==='en'?'active':''}" onclick="S.editorLang='en';renderAgentEditor()">EN</button>
            </div>
          </div>
          <button class="btn sm primary" id="ea-gen-btn" onclick="generateSystemPrompt()" style="width:100%">
            <i class="ti ti-sparkles"></i> Generar system prompt
          </button>
        </div>
      </div>

      <div class="field"><label>System prompt</label>
        <textarea id="ea-system" rows="8"
          oninput="S.editorAgent.system=this.value;S.editorDirty=true">${esc(a.system||'')}</textarea>
      </div>
    </div>
    <div class="editor-foot">
      ${!isNew?`<button class="btn danger sm" onclick="deleteCurrentAgent()"><i class="ti ti-trash"></i></button>`:''}
      <button class="btn primary" style="flex:1" onclick="saveCurrentAgent()"><i class="ti ti-device-floppy"></i> Guardar</button>
    </div>`;
}

function closeAgentEditor() {
  S.editorAgent = null;
  S.selectedAgent = null;
  document.getElementById('agent-editor').style.display='none';
  renderAgentsCenter();
}

function toggleTool(tool, checked) {
  const tools = S.editorAgent.tools || [];
  if (checked && !tools.includes(tool)) tools.push(tool);
  if (!checked) S.editorAgent.tools = tools.filter(t=>t!==tool);
  else S.editorAgent.tools = tools;
  S.editorDirty = true;
}

async function generateSystemPrompt() {
  const desc = document.getElementById('ea-ai-desc')?.value?.trim();
  if (!desc) { toast('Escribe una descripción primero','err'); return; }
  const btn = document.getElementById('ea-gen-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Generando…';
  try {
    const n = S.selectedNode;
    const existing = S.agents.map(a=>a.name);
    const r = await req('POST','/ai/generate-prompt',{
      description: desc,
      name: S.editorAgent.name || 'agent',
      level: n.level,
      categoryId: n.categoryId,
      techId: n.techId,
      tools: S.editorAgent.tools || [],
      language: S.editorLang,
      existingAgents: existing,
    });
    S.editorAgent.system = r.system;
    S.editorDirty = true;
    document.getElementById('ea-system').value = r.system;
    toast('System prompt generado');
  } catch(e) { toast(e.message,'err'); }
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-sparkles"></i> Generar system prompt';
}

async function saveCurrentAgent() {
  const a = S.editorAgent;
  if (!a) return;
  if (!a.name?.trim()) { toast('El agente necesita un nombre','err'); return; }
  const n = S.selectedNode;
  const oldName = S.editorIsNew ? a.name : (S.selectedAgent || a.name);
  try {
    if (n.level === 'project') {
      await req(S.editorIsNew ? 'POST' : 'PUT', `/projects/${n.projectId}/agents`,
        S.editorIsNew ? {agent:a} : {oldName, agent:a});
    } else {
      await req(S.editorIsNew ? 'POST' : 'PUT', '/agents',
        S.editorIsNew
          ? {level:n.level, categoryId:n.categoryId, techId:n.techId, agent:a}
          : {level:n.level, categoryId:n.categoryId, techId:n.techId, oldName, agent:a});
    }
    toast(`Agente "${a.name}" guardado`);
    S.editorIsNew = false;
    S.editorDirty = false;
    S.selectedAgent = a.name;
    await loadAgentsForNode();
    renderAgentsCenter();
    renderAgentEditor();
  } catch(e) { toast(e.message,'err'); }
}

async function deleteCurrentAgent() {
  const a = S.editorAgent;
  if (!a||!a.name) return;
  if (!confirm(`¿Eliminar el agente "${a.name}"? Esta acción elimina el fichero .md.`)) return;
  const n = S.selectedNode;
  try {
    if (n.level==='project') {
      await req('DELETE', `/projects/${n.projectId}/agents/${a.name}`);
    } else {
      await req('DELETE', '/agents', {level:n.level, categoryId:n.categoryId, techId:n.techId, name:a.name});
    }
    toast(`Agente "${a.name}" eliminado`);
    closeAgentEditor();
    await loadAgentsForNode();
    renderAgentsCenter();
  } catch(e) { toast(e.message,'err'); }
}

async function checkUpdateManual() {
  const el = document.getElementById('update-settings-status');
  if (el) el.textContent = 'Buscando…';
  if (!window.api?.checkForUpdate) {
    if (el) el.textContent = 'Auto-update solo disponible en la versión empaquetada.';
    return;
  }
  const result = await window.api.checkForUpdate();
  if (result?.error) {
    if (el) el.textContent = 'Error: ' + result.error;
    toast('Error: ' + result.error, 'err');
  } else {
    if (el) el.textContent = 'Comprobando… (el banner aparecerá si hay nueva versión)';
  }
}

async function importAgentFromUrl() {
  const url = document.getElementById('import-agent-url')?.value?.trim();
  if (!url) { toast('Introduce una URL','err'); return; }
  const status = document.getElementById('import-agent-status');
  if (status) status.textContent = 'Descargando…';
  try {
    const { agent } = await req('POST', '/agents/import-url', { url });
    if (status) status.textContent = '';
    _showImportAgentModal(agent);
  } catch(e) {
    if (status) status.textContent = '';
    toast(e.message || 'Error al importar el agente', 'err');
  }
}

function _showImportAgentModal(agent) {
  const cats = S.config?.categories || [];
  const MODEL_OPTS = ['sonnet','haiku','opus'].map(m =>
    `<option value="${m}" ${agent.model===m?'selected':''}>${m}</option>`
  ).join('');
  const ALL_TOOLS = ['Bash','Read','Write','Edit','Grep','Glob','WebFetch','WebSearch','MultiEdit','TodoRead','TodoWrite'];
  const toolChecks = ALL_TOOLS.map(t =>
    `<label style="display:inline-flex;align-items:center;gap:4px;font-size:11px;margin:2px 6px 2px 0;cursor:pointer">
      <input type="checkbox" value="${t}" ${(agent.tools||[]).includes(t)?'checked':''}> ${t}
    </label>`
  ).join('');

  let catOptions = `<option value="global">Global (disponible en todos los proyectos)</option>`;
  for (const cat of cats) {
    catOptions += `<option value="section:${cat.id}">Sección: ${esc(cat.name)}</option>`;
    for (const tech of (cat.technologies||[])) {
      catOptions += `<option value="tech:${cat.id}:${tech.id}">Tech: ${esc(cat.name)} › ${esc(tech.name)}</option>`;
    }
  }

  showModal('Revisar e importar agente', '', `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field" style="margin-bottom:0"><label>Nombre</label>
        <input id="ia-name" value="${esc(agent.name||'')}"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Descripción</label>
        <input id="ia-desc" value="${esc(agent.description||'')}"/>
      </div>
      <div class="field" style="margin-bottom:0"><label>Modelo</label>
        <select id="ia-model">${MODEL_OPTS}</select>
      </div>
      <div class="field" style="margin-bottom:0"><label>Herramientas</label>
        <div style="background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:8px">${toolChecks}</div>
      </div>
      <div class="field" style="margin-bottom:0"><label>System prompt</label>
        <textarea id="ia-system" rows="6" style="font-family:var(--mono);font-size:11px;resize:vertical">${esc(agent.system||'')}</textarea>
      </div>
      <div class="field" style="margin-bottom:0"><label>Guardar en</label>
        <select id="ia-dest">${catOptions}</select>
      </div>
    </div>
  `, async () => {
    const name   = document.getElementById('ia-name')?.value?.trim();
    const desc   = document.getElementById('ia-desc')?.value?.trim();
    const model  = document.getElementById('ia-model')?.value;
    const system = document.getElementById('ia-system')?.value?.trim();
    const dest   = document.getElementById('ia-dest')?.value;
    const tools  = [...document.querySelectorAll('.modal-body input[type=checkbox][value]')].filter(cb=>cb.checked).map(cb=>cb.value);

    if (!name) { toast('El nombre es obligatorio','err'); return false; }

    let level='global', categoryId=undefined, techId=undefined;
    if (dest === 'global') { level = 'global'; }
    else if (dest.startsWith('tech:')) { const [,c,t]=dest.split(':'); level='tech'; categoryId=c; techId=t; }
    else if (dest.startsWith('section:')) { const [,c]=dest.split(':'); level='section'; categoryId=c; }

    try {
      await req('POST','/agents',{ level, categoryId, techId, agent:{ name, description:desc, model, tools, system } });
      toast(`Agente "${name}" importado`);
      S.agents = null;
      if (window._reloadAgentsView) window._reloadAgentsView();
    } catch(e) { toast(e.message,'err'); return false; }
  });

  // Fix tool checkboxes — re-query after modal renders
  requestAnimationFrame(() => {
    const boxes = document.querySelectorAll('.modal-body input[type=checkbox][value]');
    boxes.forEach(cb => { if ((agent.tools||[]).includes(cb.value)) cb.checked = true; });
  });
}

function renderWizStep() {
  const step = WIZ_STEPS[S.wizStep];
  const total = WIZ_STEPS.length;
  for (let i=0;i<total;i++) {
    const d = document.getElementById(`wd${i}`);
    if (d) d.className = 'wiz-dot '+(i<S.wizStep?'done':i===S.wizStep?'cur':'');
  }
  document.getElementById('wiz-title').textContent = step.title;
  document.getElementById('wiz-sub').textContent   = step.sub;
  document.getElementById('wiz-body').innerHTML    = step.body();
  document.getElementById('wiz-next').innerHTML    = `${step.next} <i class="ti ti-arrow-right"></i>`;
  document.getElementById('wiz-next').disabled     = step.autoNext || false;
  const skip = document.getElementById('wiz-skip');
  skip.textContent = step.skip||'';
  skip.style.visibility = step.skip ? 'visible' : 'hidden';
  if (step.onMount) step.onMount();
}

  renderWizStep();
}

    <!-- GitHub Copilot / Models -->
    <div class="ai-opt ${S.aiChoice==='github'?'on':''}" onclick="S.aiChoice='github';renderAIBody()">
      <div class="ai-opt-head">
        <div class="ai-radio ${S.aiChoice==='github'?'on':''}"></div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--text0);display:flex;align-items:center;gap:8px">
            GitHub Copilot
            <span class="badge blue">Models API</span>
          </div>
          <div style="font-size:11px;color:var(--text1);margin-top:2px">Usa tu cuenta de GitHub. Capa gratuita disponible.</div>
        </div>
      </div>
      ${S.aiChoice==='github'?`<div style="margin-top:12px">
        <div class="field" style="margin-bottom:8px">
          <label>GitHub Personal Access Token</label>
          <input id="wiz-ghtoken" type="password" placeholder="ghp_…" onclick="event.stopPropagation()" style="font-family:var(--mono)"/>
          <div class="hint">github.com → Settings → Developer settings → Personal access tokens → Fine-grained → <strong>Models: Read</strong></div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Modelo</label>
          <select id="wiz-ghmodel" onclick="event.stopPropagation()">
            <option value="gpt-4o-mini" selected>gpt-4o-mini (rápido, gratuito)</option>
            <option value="gpt-4o">gpt-4o (potente)</option>
            <option value="o1-mini">o1-mini (razonamiento)</option>
          </select>
        </div>
      </div>`:''}
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:11px;color:var(--text2)">o</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>

    <!-- Anthropic API key -->
    <div class="ai-opt ${S.aiChoice==='api'?'on':''}" onclick="S.aiChoice='api';renderAIBody()">
      <div class="ai-opt-head">
        <div class="ai-radio ${S.aiChoice==='api'?'on':''}"></div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text0)">API key de Anthropic</div>
          <div style="font-size:11px;color:var(--text1);margin-top:2px">Acceso directo a Claude. Requiere cuenta en console.anthropic.com.</div>
        </div>
      </div>
      ${S.aiChoice==='api'?`<div style="margin-top:12px">
        <div class="field" style="margin-bottom:0">
          <label>API key</label>
          <input id="wiz-apikey" type="password" placeholder="sk-ant-api03-…" onclick="event.stopPropagation()" style="font-family:var(--mono)"/>
        </div>
      </div>`:''}
    </div>`;
}
async function wizRecheckCLI() {
  try {
    const r = await req('GET','/detect-cli');
    S.cliFound=r.found; S.cliPath=r.path;
    if (r.found) { S.aiChoice='cli'; toast('Claude CLI detectado'); }
    else toast('CLI no encontrado aún','err');
  } catch {}
  renderAIBody();
}
async function saveAIProviderChoice() {
  const provider = S.aiChoice || 'cli';
  const body     = { aiProvider: provider };
  if (provider === 'api') {
    body.apiKey = document.getElementById('wiz-apikey')?.value?.trim() || '';
  }
  if (provider === 'github') {
    body.githubToken = document.getElementById('wiz-ghtoken')?.value?.trim() || '';
    body.githubModel = document.getElementById('wiz-ghmodel')?.value || 'gpt-4o-mini';
  }
  await req('PUT', '/config', body);
  if (S.config) Object.assign(S.config, body);
}
async function runSetup() {
  const log = document.getElementById('setup-log');
  const item = (icon,color,msg) => {
    const d = document.createElement('div');
    d.className='setup-item';
    d.innerHTML=`<i class="ti ${icon}" style="font-size:14px;color:${color}"></i><span>${msg}</span>`;
    log.appendChild(d);
  };
  const spinner = () => {
    const d = document.createElement('div');
    d.className='setup-item';
    d.innerHTML=`<div class="spin"></div><span>Creando estructura de carpetas…</span>`;
    log.appendChild(d); return d;
  };
  const el = spinner();
  try {
    const r = await req('POST','/setup',{});
    el.innerHTML=`<i class="ti ti-check" style="font-size:14px;color:var(--green)"></i><span>Estructura creada · ${r.agentsCreated} agentes cargados</span>`;
    await new Promise(res=>setTimeout(res,400));
    item('ti-check','var(--green)','¡Todo listo!');
    document.getElementById('wiz-next').disabled = false;
    document.getElementById('wiz-sub').textContent = 'La aplicación está configurada y lista para usar.';
    // Reload config and projects
    S.config   = await req('GET','/config');
    S.projects = await req('GET','/projects');
    toast('Configuración completada');
  } catch(e) {
    el.innerHTML=`<i class="ti ti-x" style="font-size:14px;color:var(--coral)"></i><span style="color:var(--coral)">Error: ${e.message}</span>`;
  }
}

// ══════════════════════════════════════════
// ── UTILS ──
// ══════════════════════════════════════════
function esc(s) {
  if (s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════
// ── INIT ──
// ══════════════════════════════════════════
async function init() {
  // Statusbar
  try {
    const h = await req('GET','/health');
    document.getElementById('srv-dot').className='sdot green';
    document.getElementById('srv-lbl').textContent=`Servidor activo`;
    document.getElementById('dir-lbl').textContent=h.appDir;
  } catch {
    document.getElementById('srv-dot').className='sdot amber';
    document.getElementById('srv-lbl').textContent='Servidor no disponible';
  }
  if (window.api) {
    const v = await window.api.getVersion().catch(()=>'1.0.0');
    document.getElementById('ver-lbl').textContent=`v${v}`;
    const d = await window.api.getAppDir().catch(()=>'');
    if (d) document.getElementById('dir-lbl').textContent=d;
  }

  // Load data
  try { S.config   = await req('GET','/config');   } catch {}
  try { S.projects = await req('GET','/projects'); } catch {}

  // Initial view
  renderProjectsView();

  // Wizard on first run
  if (!localStorage.getItem('cdm-wizard-done')) openWizard();
}

init();

// ── Auto-update UI ────────────────────────────────────────────────────────────
(function setupUpdateListeners() {
  if (!window.api) return;

  const banner    = document.getElementById('update-banner');
  const bannerSub = document.getElementById('update-banner-sub');
  const bannerBtn = document.getElementById('update-banner-btn');

  window.api.onUpdateAvailable((info) => {
    bannerSub.textContent = `v${info.version} lista para descargar`;
    bannerBtn.textContent = 'Descargar';
    bannerBtn.onclick = async () => {
      bannerBtn.textContent = 'Descargando…';
      bannerBtn.disabled = true;
      await window.api.downloadUpdate();
    };
    banner.style.display = 'flex';
  });

  window.api.onUpdateProgress((pct) => {
    bannerSub.textContent = `Descargando… ${pct}%`;
  });

  window.api.onUpdateReady(() => {
    document.getElementById('update-banner-title').textContent = '¡Actualización lista!';
    bannerSub.textContent = 'Se instalará al reiniciar la app';
    bannerBtn.textContent = 'Reiniciar ahora';
    bannerBtn.disabled = false;
    bannerBtn.onclick = () => window.api.installUpdate();
    banner.style.display = 'flex';
  });

  window.api.onUpdateError((msg) => {
    toast('Error al buscar actualización: ' + msg, 'err');
    banner.style.display = 'none';
    const el = document.getElementById('update-settings-status');
    if (el) el.textContent = 'Error: ' + msg;
  });
})();
</script>
