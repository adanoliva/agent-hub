appId: com.adanoliva.agent-hub
productName: Agent Hub
copyright: Copyright © 2025

publish:
  provider: github
  owner: adanoliva
  repo: agent-hub
  private: true
  releaseType: release

directories:
  buildResources: assets
  output: dist

win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  # Request admin rights only if needed (not required for portable)
  requestedExecutionLevel: asInvoker
  # Disable executable editing/signing so Windows builds do not require winCodeSign extraction.
  signAndEditExecutable: false

portable:
  artifactName: agent-hub.exe
  # electron-builder sets PORTABLE_EXECUTABLE_DIR at runtime
  # so config.js can find the correct data directory next to the .exe

files:
  # Runtime source files (backend only)
  - src/backend/**/*
  - dist/renderer/**/*
  - package.json
  # All node_modules (asar bundles them efficiently)
  - node_modules/**/*
  # Exclude things that bloat the build
  - "!node_modules/.bin/**"
  - "!node_modules/**/{test,tests,__tests__,spec,specs}/**"
  - "!node_modules/**/*.{md,markdown,txt,log}"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/CHANGELOG*"
  - "!node_modules/**/README*"
  - "!node_modules/**/{example,examples,demo,demos}/**"
  - "!**/.git/**"
  - "!**/.github/**"

# Assets are available at process.resourcesPath/assets/ in production
extraResources:
  - from: assets/
    to: assets/
    filter:
      - "**/*"
  - from: app-update.yml
    to: app-update.yml

asar: true
compression: normal
nodeGypRebuild: false
